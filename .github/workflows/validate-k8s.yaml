name: Validate Kubernetes manifests

on:
  push:
    paths:
      - 'k8s/**'
  pull_request:
    paths:
      - 'k8s/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Install kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Build dev overlay
        run: kubectl kustomize k8s/overlays/dev > dev-rendered.yaml

      - name: Build prod overlay
        run: kubectl kustomize k8s/overlays/prod > prod-rendered.yaml

      - name: Validate dev overlay against Kubernetes schema
        run: kubeconform -summary -strict dev-rendered.yaml

      - name: Validate prod overlay against Kubernetes schema
        run: kubeconform -summary -strict prod-rendered.yaml

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Minikube (dev overlay)
        run: kubectl apply -k k8s/overlays/dev

      - name: Wait for Ollama rollout
        run: kubectl rollout status deployment/ollama -n llm-devops --timeout=180s

      - name: Wait for Open WebUI rollout
        run: kubectl rollout status deployment/open-webui -n llm-devops --timeout=180s