apiVersion: apps/v1
kind: Deployment

metadata:
  name: ollama
  namespace: llm-devops

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ollama

  template:
    metadata:
      labels:
        app: ollama
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"

    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 11434
              protocol: TCP

          envFrom:
            - configMapRef:
                name: ollama-config

          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"

          volumeMounts:
            - name: ollama-storage
              mountPath: /root/.ollama

          startupProbe:
            httpGet:
              path: /api/version
              port: 11434
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /api/version
              port: 11434
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /api/version
              port: 11434
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

        - name: ollama-exporter
          image: lucabecker42/ollama-exporter:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000
              protocol: TCP

          env:
            - name: PORT
              value: "8000"
            - name: INTERVAL
              value: "30"
            - name: OLLAMA_HOST
              value: "localhost:11434"
            - name: API_TIMEOUT
              value: "30"
            - name: LOG_LEVEL
              value: "INFO"

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

      volumes:
        - name: ollama-storage
          persistentVolumeClaim:
            claimName: ollama-pvc