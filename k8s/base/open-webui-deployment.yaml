apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: llm-devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: open-webui-config
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
          volumeMounts:
            - name: open-webui-data
              mountPath: /app/backend/data

        - name: open-webui-exporter
          image: ghcr.io/baselhusam/open-webui-exporter:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9090
              protocol: TCP
          env:
            - name: OPENWEBUI_BASE_URL
              value: "http://localhost:8080"
            - name: EXPORTER_PORT
              value: "9090"
            - name: POLL_INTERVAL_SECONDS
              value: "30"
            - name: OPENWEBUI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: open-webui-exporter-secret
                  key: api-key
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9090
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

      volumes:
        - name: open-webui-data
          persistentVolumeClaim:
            claimName: open-webui-pvc